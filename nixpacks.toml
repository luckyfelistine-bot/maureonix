[phases.setup]
nixPkgs = [
  "nodejs",
  "npm",
  "ffmpeg",
  "python310",
  "python310Packages.pip",
  "tesseract",
  "gcc",
  "pkg-config",
  # ── Chromium dependencies for puppeteer-core ──
  "libnss3",
  "libatk-bridge2.0-0",
  "libgtk-3-0",
  "libgbm1",
  "libxkbcommon0",
  "libasound2",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "libcups2",
  "libdbus-1-3",
  "libnspr4",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "ca-certificates",
  "fonts-liberation",
  "wget",
  "xdg-utils"
