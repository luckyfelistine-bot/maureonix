<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff">
        <animate attributeName="stop-color" values="#00f3ff;#bc13fe;#ff00ff;#00f3ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc13fe">
        <animate attributeName="stop-color" values="#bc13fe;#ff00ff;#00f3ff;#bc13fe" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff00ff">
        <animate attributeName="stop-color" values="#ff00ff;#00f3ff;#bc13fe;#ff00ff" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" x="0" y="0" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100%" height="2" fill="#000" opacity="0.3"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00f3ff" stroke-width="0.4" opacity="0.08"/>
    </pattern>
    <clipPath id="clip">
      <rect x="100" y="85" width="1000" height="130"/>
    </clipPath>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="440" fill="#03030a"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="120" cy="50" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70" r="1" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="65" r="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="45" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="110" r="1" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="3.9s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="30" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="90" r="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="4.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="55" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="1" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="2.6s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="140" r="1" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="120" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="4.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Perspective lines -->
  <g stroke="#00f3ff" stroke-width="0.8" opacity="0.1">
    <line x1="600" y1="190" x2="0" y2="440"/><line x1="600" y1="190" x2="250" y2="440"/>
    <line x1="600" y1="190" x2="500" y2="440"/><line x1="600" y1="190" x2="750" y2="440"/>
    <line x1="600" y1="190" x2="1000" y2="440"/><line x1="600" y1="190" x2="1200" y2="440"/>
  </g>

  <!-- Text layers for chromatic aberration -->
  <g transform="translate(0,10)">
    <text x="604" y="190" text-anchor="middle" font-family="monospace" font-size="105" font-weight="bold" fill="#00f3ff" opacity="0.45" filter="url(#glow)">MAUREONIX</text>
    <text x="596" y="190" text-anchor="middle" font-family="monospace" font-size="105" font-weight="bold" fill="#ff00ff" opacity="0.45" filter="url(#glow)">MAUREONIX</text>
    <text x="600" y="190" text-anchor="middle" font-family="monospace" font-size="105" font-weight="bold" fill="url(#neon)" filter="url(#glow)">MAUREONIX</text>
    <text x="600" y="190" text-anchor="middle" font-family="monospace" font-size="105" font-weight="bold" fill="#ffffff" opacity="0.85">MAUREONIX</text>
  </g>

  <!-- Glitch bars -->
  <g clip-path="url(#clip)">
    <rect x="100" y="125" width="1000" height="7" fill="#00f3ff" opacity="0"><animate attributeName="opacity" values="0;0.75;0" dur="0.2s" begin="2.1s;6.3s;10.8s"/></rect>
    <rect x="100" y="158" width="1000" height="5" fill="#ff00ff" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="0.15s" begin="3.4s;7.7s;12.1s"/></rect>
    <rect x="100" y="188" width="1000" height="9" fill="#bc13fe" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="0.25s" begin="4.8s;9.2s;14.5s"/></rect>
    <rect x="100" y="145" width="1000" height="4" fill="#00ff9d" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="0.18s" begin="5.5s;11.0s"/></rect>
  </g>

  <!-- Subtitle -->
  <text x="600" y="248" text-anchor="middle" font-family="monospace" font-size="19" fill="#a0a0c8" letter-spacing="7">AUTONOMOUS WHATSAPP INTELLIGENCE</text>

  <!-- Hexagon badge -->
  <g transform="translate(540, 275)">
    <polygon points="60,0 115,15 115,52 60,67 5,52 5,15" fill="#060614" stroke="url(#neon)" stroke-width="2.5"/>
    <text x="60" y="43" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#00f3ff">PROTOCOL</text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="390" width="1200" height="50" fill="#010108" opacity="0.97"/>
  <line x1="0" y1="390" x2="1200" y2="390" stroke="#00f3ff" stroke-width="1.5" opacity="0.35"/>

  <circle cx="65" cy="415" r="5" fill="#00ff9d"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="85" y="420" font-family="monospace" font-size="12" fill="#c0c0d8">SYSTEM ONLINE</text>

  <circle cx="310" cy="415" r="5" fill="#ff00ff"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></circle>
  <text x="330" y="420" font-family="monospace" font-size="12" fill="#c0c0d8">NEURAL LINK ACTIVE</text>

  <circle cx="600" cy="415" r="5" fill="#00f3ff"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  <text x="620" y="420" font-family="monospace" font-size="12" fill="#c0c0d8">ENCRYPTION ENABLED</text>

  <text x="1120" y="420" text-anchor="end" font-family="monospace" font-size="11" fill="#444">MAUREONIX-NEURAL-NETWORK-v6</text>

  <!-- Scanlines -->
  <rect width="1200" height="440" fill="url(#scan)" pointer-events="none">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="0.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Vignette -->
  <rect width="1200" height="440" fill="url(#vig)" pointer-events="none"/>

  <!-- Corner brackets -->
  <path d="M 12 12 L 68 12 L 68 22 L 22 22 L 22 68 L 12 68 Z" fill="#00f3ff" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M 1188 12 L 1132 12 L 1132 22 L 1178 22 L 1178 68 L 1188 68 Z" fill="#ff00ff" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="4s" begin="1s" repeatCount="indefinite"/>
  </path>
  <path d="M 12 428 L 68 428 L 68 418 L 22 418 L 22 372 L 12 372 Z" fill="#bc13fe" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="4s" begin="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 1188 428 L 1132 428 L 1132 418 L 1178 418 L 1178 372 L 1188 372 Z" fill="#00f3ff" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.15;0.55" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </path>
</svg>
