<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
  <defs>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#bc13fe"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="foxGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="200,10 370,105 370,295 200,390 30,295 30,105"/>
    </clipPath>
  </defs>

  <!-- Outer rotating ring -->
  <polygon points="200,5 375,102.5 375,297.5 200,395 25,297.5 25,102.5" fill="none" stroke="url(#foxGrad)" stroke-width="3" filter="url(#foxGlow)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="30s" repeatCount="indefinite"/>
  </polygon>

  <!-- Inner counter-rotating ring -->
  <polygon points="200,25 355,110 355,290 200,375 45,290 45,110" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="20s" repeatCount="indefinite"/>
  </polygon>

  <!-- Background -->
  <polygon points="200,15 365,107.5 365,292.5 200,385 35,292.5 35,107.5" fill="#080818"/>

  <!-- Neural Network -->
  <g clip-path="url(#hexClip)">
    <!-- Nodes -->
    <circle cx="130" cy="130" r="10" fill="#00f3ff" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="130" r="10" fill="#ff00ff" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="90" r="12" fill="#bc13fe" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="240" r="8" fill="#00ff9d" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="240" r="8" fill="#00f3ff" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="280" r="11" fill="#ff00ff" filter="url(#foxGlow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="190" r="14" fill="#ffffff" opacity="0.9" filter="url(#foxGlow)">
      <animate attributeName="r" values="14;16;14" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Connections -->
    <line x1="130" y1="130" x2="200" y2="90" stroke="#00f3ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="270" y1="130" x2="200" y2="90" stroke="#ff00ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="130" y1="130" x2="110" y2="240" stroke="#bc13fe" stroke-width="1.5" opacity="0.35"/>
    <line x1="270" y1="130" x2="290" y2="240" stroke="#bc13fe" stroke-width="1.5" opacity="0.35"/>
    <line x1="110" y1="240" x2="200" y2="280" stroke="#00ff9d" stroke-width="1.5" opacity="0.4"/>
    <line x1="290" y1="240" x2="200" y2="280" stroke="#00f3ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="130" y1="130" x2="270" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <line x1="110" y1="240" x2="290" y2="240" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <line x1="200" y1="90" x2="200" y2="190" stroke="#bc13fe" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="190" x2="200" y2="280" stroke="#bc13fe" stroke-width="2" opacity="0.5"/>
    <line x1="130" y1="130" x2="200" y2="190" stroke="#00f3ff" stroke-width="1.5" opacity="0.3"/>
    <line x1="270" y1="130" x2="200" y2="190" stroke="#ff00ff" stroke-width="1.5" opacity="0.3"/>

    <!-- Core -->
    <polygon points="200,175 215,190 200,205 185,190" fill="url(#foxGrad)" opacity="0.9" filter="url(#foxGlow)"/>

    <!-- Label -->
    <text x="200" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#00f3ff" opacity="0.6">NEURAL FOX v6.0</text>
  </g>

  <!-- Scanlines inside hex -->
  <defs>
    <pattern id="foxScan" x="0" y="0" width="100%" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100%" height="1.5" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>
  <polygon points="200,15 365,107.5 365,292.5 200,385 35,292.5 35,107.5" fill="url(#foxScan)" clip-path="url(#hexClip)" pointer-events="none"/>
</svg>
